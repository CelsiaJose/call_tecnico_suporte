name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "===== Iniciando deploy automático ====="

            # Navega até a pasta do projeto
            cd /home/ubuntu/projectsgcp/ec2_1/call_tecnico_suporte

            # Atualiza o código do branch main
            git fetch --all
            git reset --hard origin/main

            # Reconstrói imagens Docker
            docker-compose build

            # Reinicia o serviço systemd que gerencia o container
            sudo systemctl restart app

            # Limpa imagens Docker antigas
            docker image prune -f

            # Confirma status do serviço
            sudo systemctl status app --no-pager

            echo "===== Deploy concluído com sucesso! ====="

