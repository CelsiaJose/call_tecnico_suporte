name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Ajusta para a versão que estás usando

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        run: |
          python manage.py test || true
          
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: tests  # <<< Aqui é o segredo: só roda se o job "tests" passar
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "===== Iniciando deploy automático ====="

            # Navega até a pasta do projeto
            cd /home/ubuntu/projectsgcp/ec2_1/call_tecnico_suporte

            # Atualiza o código do branch main
            git fetch --all
            git reset --hard origin/main

            # Reconstrói imagens Docker
            docker-compose build

            # Reinicia o serviço systemd que gerencia o container
            sudo systemctl restart app

            # Limpa imagens Docker antigas
            docker image prune -f

            # Confirma status do serviço
            sudo systemctl status app --no-pager

            echo "===== Deploy concluído com sucesso! ====="